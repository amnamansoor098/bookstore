version: '3.8'

services:
  app:
    image: amnamansoor226/bookstore:latest
    container_name: bookstore_app
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/bookstore
      - PORT=3000
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:6
    container_name: bookstore_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data: